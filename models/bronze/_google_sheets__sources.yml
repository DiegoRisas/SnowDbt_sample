version: 2

sources:
  - name: google_sheets
    description: "Tablas cargadas desde Google Sheets"
    database: DEV_BRONZE_DB
    schema: "google_sheets"
    tables:
      - name: budget
        description: "Presupuesto por producto y mes procedente de Google Sheets"
        columns:
          - name: _row
            data_tests:
              - unique
              - not_null
          - name: product_id
            data_tests:
              - relationships:
                  arguments:
                    to: source('sql_server_dbo', 'products')
                    field: product_id
          - name: quantity
          - name: month